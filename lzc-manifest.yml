application:
  subdomain: sonarr
  multi_instance: false
  # This app authenticates its own users, so it is exposed directly
  # instead of sitting behind the platform login gate.
  public_path:
    - /
  upstreams:
    - location: /package-licenses/
      backend: file:///lzcapp/pkg/content/licenses/
    - location: /
      backend: http://sonarr:8989/

services:
  sonarr:
    # upstream: linuxserver/sonarr:4.0.20
    image: docker.1ms.run/linuxserver/sonarr:4.0.20
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      # Sonarr v4 reads its options from the "Sonarr:" config section, which
      # .NET maps to SONARR__ prefixed environment variables. Seeding the first
      # account here means the UI is never reachable without a login, instead
      # of relying on the operator to set one up after the fact.
      - SONARR__AUTH__ENABLED=true
      - SONARR__AUTH__METHOD=Forms
      - SONARR__AUTH__REQUIRED=Enabled
      - |-
        SONARR__AUTH__INITIALUSERNAME={{ .U.admin_username }}
      - |-
        SONARR__AUTH__INITIALPASSWORD={{ .U.admin_password }}
      - SONARR__UPDATE__BRANCH=master
      - SONARR__UPDATE__MECHANISM=external
    binds:
      # database, config.xml and logs live here
      - /lzcapp/var/config:/config
      - /lzcapp/var/tv:/tv
      - /lzcapp/var/downloads:/downloads

usage: |
  Sonarr 是剧集管理工具：订阅电视剧，自动追新集并整理成规范的媒体库。

  使用方法：
  1. 打开应用，用你安装时设置的用户名和密码登录。
  2. 先在"设置 → 媒体管理"里确认根目录（默认 /tv）。
  3. 添加"索引器"（Indexer）和"下载客户端"（Download Client），
     比如 Transmission、qBittorrent 或 SABnzbd。
  4. 搜索想追的剧集并添加，Sonarr 会按你的质量偏好自动筛选和下载，
     下载完成后重命名为规范的目录结构。
  5. 也能在"日历"里看到近期更新的剧集。

  数据与安全：
  - 数据库、配置和日志都在 /lzcapp/var/config，媒体库在 /lzcapp/var/tv，
    下载目录在 /lzcapp/var/downloads。卸载应用会一并删除，请定期备份。
  - 登录账号密码来自安装参数，密码默认随机生成，不存在内置弱口令；
    **首次启动即以表单登录保护界面**，不会出现无鉴权的窗口期。
  - 应用直接对外开放，由应用自己的登录页鉴权：
    自带账号体系的服务再套一层平台鉴权会造成重复登录，所以用 public_path。

  说明：
  - 单容器部署，使用内置 SQLite，无需额外数据库。
  - 已关闭内置自动更新（由商店统一管理版本），因此界面里不会有"更新"提示。
  - 需要自行准备索引器与下载客户端才能实际下载内容；本包不包含这些外部服务。
  - 未做真机验证：登录、添加剧集、对接下载器以及重启后持久化均未在设备上实测。
